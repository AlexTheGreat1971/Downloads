name: Temporary IPT diagnostic recovery and read-only decode

on:
  push:
    branches:
      - "temp/ipt-diagnostic-recovery-20261113"
    paths:
      - ".github/workflows/recover-ipt-diagnostics-temporary.yml"

permissions:
  contents: read

jobs:
  recover-and-decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic files only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decode and validate Inventor files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          files = [
              "20261112-163914-INNER-SB05-FULL-MAX-CH0-FAIL-DIAGNOSTIC.ipt",
              "20261112-163914-INNER-SB05-PARTIAL14-MIN-CH0-FAIL-DIAGNOSTIC.ipt",
          ]
          expected_magic = bytes.fromhex("D0CF11E0A1B11AE1")
          output = Path("recovered")
          output.mkdir(exist_ok=True)
          checksums = []

          for name in files:
              source = Path(name + ".b64")
              encoded = source.read_text(encoding="ascii").strip()
              data = base64.b64decode(encoded, validate=True)
              if not data.startswith(expected_magic):
                  raise SystemExit(f"Invalid OLE/Inventor container signature: {source}")
              target = output / name
              target.write_bytes(data)
              digest = hashlib.sha256(data).hexdigest()
              checksums.append(f"{digest}  {name}")
              print(f"Recovered {name}: {len(data)} bytes, SHA256={digest}")

          (output / "SHA256SUMS.txt").write_text("\n".join(checksums) + "\n", encoding="ascii")
          PY

      - name: Download and verify pinned read-only IPT decoder
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/cadmpeg/cadmpeg/releases/download/v0.6.11/cadmpeg-x86_64-unknown-linux-gnu.tar.xz"
          expected="cdc95d3e6f07944f8a9a80c99259bd957d5afeecd4337d1a80ed6659e37a3abd"
          curl --fail --location --retry 3 "$url" --output /tmp/cadmpeg.tar.xz
          echo "$expected  /tmp/cadmpeg.tar.xz" | sha256sum --check -
          mkdir -p /tmp/cadmpeg-dist
          tar -xJf /tmp/cadmpeg.tar.xz -C /tmp/cadmpeg-dist
          bin="$(find /tmp/cadmpeg-dist -type f -name cadmpeg -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          "$bin" --version
          echo "$bin" > /tmp/cadmpeg-bin-path

      - name: Inspect and decode both IPT files without modifying them
        shell: bash
        run: |
          set -u
          mkdir -p analysis
          bin="$(cat /tmp/cadmpeg-bin-path)"
          for input in recovered/*.ipt; do
            name="$(basename "$input" .ipt)"
            echo "===== $name ====="
            "$bin" inspect "$input" --json > "analysis/$name.inspect.json" 2> "analysis/$name.inspect.log"
            echo "$?" > "analysis/$name.inspect.exit"
            "$bin" dump "$input" -o "analysis/$name.cadir.json" 2> "analysis/$name.dump.log"
            echo "$?" > "analysis/$name.dump.exit"
            if [ -s "analysis/$name.cadir.json" ]; then
              "$bin" check "analysis/$name.cadir.json" --json > "analysis/$name.check.json" 2> "analysis/$name.check.log"
              echo "$?" > "analysis/$name.check.exit"
            fi
            "$bin" convert "$input" -o "analysis/$name.step" --to step --allow-errors > "analysis/$name.convert.stdout" 2> "analysis/$name.convert.log"
            echo "$?" > "analysis/$name.convert.exit"
            ls -lh "analysis/$name".* 2>/dev/null || true
          done

      - name: Upload recovered files and decode reports
        uses: actions/upload-artifact@v4
        with:
          name: recovered-inventor-ipt-diagnostics-with-decode
          path: |
            recovered/
            analysis/
          if-no-files-found: error
          retention-days: 1
